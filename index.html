<title>DHC-6 Load &amp; Balance</title>
<style>
:root{

  --m:#1d63d5;--m-bg:#e9f1ff;--m-bd:#bcd2fb;--fem:#b42367;--fem-bg:#fceaf3;--fem-bd:#f3c2d8;

}
*{box-sizing:border-box}

button,input,select,textarea{font:inherit}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.sm{font-size:12.5px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.76;margin-bottom:3px}

/* App chrome */
.appbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--navy-950),var(--navy-800));color:#fff;border-bottom:1px solid rgba(255,255,255,.1);box-shadow:0 5px 18px rgba(5,20,35,.22)}
.appbar-inner{max-width:var(--maxw);margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px}.brandmark{width:42px;height:42px;border:1px solid rgba(255,255,255,.22);border-radius:13px;background:linear-gradient(145deg,rgba(57,197,232,.3),rgba(35,118,232,.18));display:grid;place-items:center;box-shadow:inset 0 1px rgba(255,255,255,.15)}
.brandmark svg{width:24px;height:24px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.appbar h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.15px}.appbar .tag{font-size:10.5px;color:#b9cbe0;margin-top:1px}
.local-badge{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#d9e8f6;font-size:10px;font-weight:700;white-space:nowrap}.local-badge:before{content:"";width:6px;height:6px;border-radius:50%;background:#52d597;box-shadow:0 0 0 3px rgba(82,213,151,.12)}
.stepper{position:sticky;top:67px;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:var(--maxw);margin:0 auto;padding:10px 14px;background:rgba(237,242,247,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(220,228,236,.8)}
.stepdot{min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;cursor:pointer;color:#718194;padding:3px 1px}.stepdot .n{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:850;background:#dce4ec;color:#718194;transition:.16s}.stepdot .t{font-size:9.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.stepdot.on .n{background:var(--blue);color:#fff;box-shadow:0 4px 10px rgba(35,118,232,.28)}.stepdot.on{color:var(--navy-900)}.stepdot.visited .n{background:#dcecf7;color:#1d638e}.stepdot.visited{color:#496579}
.view{max-width:var(--maxw);margin:0 auto;padding:12px 16px calc(116px + env(safe-area-inset-bottom));display:grid;gap:14px}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:25;display:flex;justify-content:space-between;gap:10px;width:min(100%,var(--maxw));padding:11px 16px calc(11px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);border:1px solid rgba(220,228,236,.95);border-bottom:0;border-radius:18px 18px 0 0;backdrop-filter:blur(14px);box-shadow:0 -8px 30px rgba(15,39,64,.1)}.nav .btn{flex:1}.nav>span{flex:1}

/* Surfaces and type */
.card{background:var(--surface);border:1px solid rgba(216,225,234,.95);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.card h2{margin:0;font-size:15px;font-weight:820;letter-spacing:-.15px;color:var(--navy-900)}.card h3{margin:0;font-size:17px}.card-head,.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-kicker{display:block;font-size:9.5px;font-weight:850;letter-spacing:1px;text-transform:uppercase;color:#568098;margin-bottom:2px}.section-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#e9f3ff;color:var(--blue);font-size:10px;font-weight:900;letter-spacing:.5px}.head-chip{font-size:12.5px;color:var(--muted)}.head-chip b{color:var(--ink)}
.notice{display:flex;align-items:flex-start;gap:4px 12px;padding:12px 14px;border-radius:14px;border:1px solid;flex-wrap:wrap;font-size:12.5px}.notice b{white-space:nowrap}.notice span{color:inherit;opacity:.88;flex:1;min-width:230px}.notice.unverified{background:var(--amber-bg);color:#8e4c05;border-color:#f3d59b}.notice.strong{border-width:1.5px}

/* Forms */
.field{margin:0 0 13px}.field:last-child{margin-bottom:0}.field label{display:block;font-size:11.5px;font-weight:750;color:#50647a;margin:0 0 6px}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.row-2{display:grid;grid-template-columns:1fr auto;gap:8px}.grid-2 .field,.grid-3 .field{margin:0}

/* Buttons */
.btn{appearance:none;border:1.5px solid transparent;border-radius:var(--radius-sm);min-height:48px;padding:0 16px;font-size:13.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;background:#edf2f7;color:var(--ink);transition:transform .1s,background .15s,border-color .15s,box-shadow .15s}.btn .i{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.btn span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}.btn small{font-size:9.5px;font-weight:650;opacity:.72;margin-top:2px}.btn:active{transform:translateY(1px)}.btn.primary{background:linear-gradient(135deg,var(--blue),#2b8be5);color:#fff;box-shadow:0 6px 14px rgba(35,118,232,.22)}.btn.primary:hover{background:linear-gradient(135deg,var(--blue-d),#247ed2)}.btn.ghost{background:#fff;border-color:var(--line);color:var(--navy-900)}.btn.ghost:hover{background:#f7f9fc}.btn.subtle{background:transparent;color:var(--muted)}.btn.block{width:100%;margin-top:10px}.btn.big{min-height:56px;font-size:14px}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}.cta-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--bad);cursor:pointer;font-size:16px;font-weight:800}

/* Status and metrics */
.hero-card{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--navy-950),var(--navy-700));color:#fff;border:0;box-shadow:0 14px 35px rgba(7,27,49,.22)}.hero-card:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-70px;top:-100px;border:34px solid rgba(57,197,232,.12)}.hero-row{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.hero-type{font-size:21px;font-weight:850;letter-spacing:-.4px}.hero-card .muted{color:#bed0e1}.hero-stats{position:relative;z-index:1;margin-top:17px}.stat-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:11px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}.stat .k{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat .v{font-size:17px;font-weight:850;letter-spacing:-.25px;white-space:nowrap}.hero-card .stat{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.12);color:#fff}.hero-card .stat .k{color:#bdd0e3}.stat.hl{background:#eaf3ff;border-color:#c9dfff}.stat.good{background:var(--good-bg);border-color:#c1e8d1}.stat.good .v{color:var(--good)}.stat.bad{background:var(--bad-bg);border-color:#f3c8c8}.stat.bad .v{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;font-size:10px;font-weight:850;letter-spacing:.35px;white-space:nowrap}.chip.green{background:var(--good-bg);color:var(--good)}.chip.amber{background:var(--amber-bg);color:var(--amber)}.chip.red{background:var(--bad-bg);color:var(--bad)}.hero-card .chip{position:relative;z-index:1;background:rgba(255,255,255,.94)}.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor}.banner{border-radius:var(--radius-sm);padding:11px 12px;font-weight:650;font-size:12.5px}.banner.amber{background:var(--amber-bg);color:var(--amber)}.banner.red{background:var(--bad-bg);color:var(--bad)}.banner.green{background:var(--good-bg);color:var(--good)}.banner-card{text-align:left;border:0;color:#fff;padding:21px 22px}.banner-card.green{background:linear-gradient(135deg,#0e7742,#1b9a5a)}.banner-card.amber{background:linear-gradient(135deg,#8d4b06,#d77a0c)}.banner-card.red{background:linear-gradient(135deg,#9f2626,#d33b3b)}.banner-word{font-size:26px;font-weight:900;letter-spacing:.3px}.banner-sub{font-size:12.5px;opacity:.9;margin-top:4px}

/* OCR */
.privacy-pill{padding:5px 9px;border-radius:999px;background:var(--good-bg);color:var(--good);font-size:10px;font-weight:800}.dropzone{min-height:154px;display:flex;align-items:center;justify-content:center;gap:14px;text-align:left;border:1.5px dashed #b9c8d7;border-radius:16px;padding:16px;color:var(--muted);background:linear-gradient(145deg,#f8fafc,#f1f6fa);margin:15px 0 11px;overflow:hidden}.dropzone>div:last-child{display:flex;flex-direction:column;min-width:0}.dropzone b{color:var(--ink);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}.dropzone span{font-size:11px;margin-top:3px}.upload-icon{width:58px;height:58px;border-radius:17px;background:#e5f2ff;color:var(--blue);display:grid!important;place-items:center;flex:none}.upload-icon svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.scan-preview{width:108px;height:126px;object-fit:cover;border-radius:12px;border:1px solid var(--line);box-shadow:0 5px 15px rgba(15,39,64,.13)}.dropzone.has-file{justify-content:flex-start;border-style:solid;background:#f7fafc}.ocr-progress{margin-top:10px}.progress-bar{height:5px;background:#e4eaf0;border-radius:99px;overflow:hidden}.progress-bar span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .2s}.progress{min-height:16px;font-size:10px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.55px;margin-top:3px}.ocr-progress p{margin:7px 0 0}.scan-result{margin-top:15px;padding:15px;border-radius:16px;background:#f6f9fc;border:1px solid var(--line)}.scan-result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.confidence{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800}.confidence.good{background:var(--good-bg);color:var(--good)}.confidence.review{background:var(--amber-bg);color:var(--amber)}.count-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:13px}.count-grid>div{padding:9px 4px;text-align:center;border-radius:10px;background:#fff;border:1px solid var(--line)}.count-grid b{display:block;font-size:17px}.count-grid span{display:block;font-size:9px;color:var(--muted)}.count-grid .unclear{background:var(--amber-bg);border-color:#efd49f}.manifest-id{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.manifest-id span{padding:4px 7px;border-radius:7px;background:#e9f3ff;color:#315b7f;font-size:10px;font-weight:800}.scan-load-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.scan-load-grid>div{padding:9px 7px;border-radius:10px;background:var(--navy-900);color:#fff}.scan-load-grid b{display:block;font-size:14px}.scan-load-grid span{display:block;font-size:8.5px;color:#b9cbe0;text-transform:uppercase;letter-spacing:.45px;margin-top:1px}.scan-evidence{margin:9px 0 0;color:#496579;font-size:10.5px;font-weight:700}.scan-issues{display:grid;gap:5px;margin-top:10px;color:var(--bad);font-size:11.5px;font-weight:650}.acc{margin-top:13px;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}.acc summary{padding:11px 12px;font-size:12px;font-weight:750;cursor:pointer;color:#40566a}.acc[open] summary{border-bottom:1px solid var(--line)}.acc textarea{border:0;border-radius:0;min-height:130px}.parse-text{margin:0!important;border-width:1px 0 0!important;border-radius:0!important}
.scan-result h3 small{font-size:10px;color:var(--muted);font-weight:750;white-space:nowrap}
.scan-edit-hint{font-size:11.5px;color:var(--muted);margin:10px 0 8px}.count-editor-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.scan-edit{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid;padding:8px 5px;border-radius:11px;font-size:10px;font-weight:800}.scan-edit.need{grid-column:1/-1;flex-direction:row;justify-content:space-between;background:var(--amber-bg);border-color:#efd49f;color:var(--amber)}.scan-edit input{width:100%;min-height:36px;padding:4px 2px;border:0;background:rgba(255,255,255,.86);font-size:18px;font-weight:900;text-align:center;color:currentColor}.scan-edit.need input{width:68px}.scan-load-editor{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}.scan-load-edit{padding:8px;border-radius:11px;background:var(--navy-900);color:#fff}.scan-load-edit>span{display:block;color:#b9cbe0;font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}.scan-load-edit>div{display:flex;align-items:center;gap:3px}.scan-load-edit input{min-height:35px;padding:4px 5px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:14px;font-weight:850}.scan-load-edit b{font-size:9px;color:#b9cbe0}.scan-notes{margin-top:9px;font-size:11px;color:var(--muted)}.scan-notes summary{cursor:pointer;font-weight:750}.scan-notes .scan-issues{margin-top:6px}

/* Seat map */
.seatmap{display:grid;gap:8px;margin:7px 0 11px}.seat-row{display:grid;grid-template-columns:21px 1fr;gap:9px;align-items:center}.seat-row .rl{font-size:10px;font-weight:850;color:#75889b;text-align:center}.seats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seat-tile{min-height:58px;border:1.5px solid var(--line);border-radius:12px;background:#f7f9fc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;color:var(--muted);transition:transform .08s,background .12s,border-color .12s}.seat-tile:active{transform:scale(.96)}.seat-tile .seat-id{font-size:9px;font-weight:750;opacity:.8}.seat-tile .seat-cat{font-size:17px;font-weight:850}.seat-lap{font-size:8px;font-weight:850;color:var(--inf);line-height:1.1}.seat-tile.empty .seat-cat{color:#b7c3cf}.cat-M{background:var(--m-bg);border-color:var(--m-bd);color:var(--m)}.cat-F{background:var(--fem-bg);border-color:var(--fem-bd);color:var(--fem)}.cat-C{background:var(--chl-bg);border-color:var(--chl-bd);color:var(--chl)}.cat-I{background:var(--inf-bg);border-color:var(--inf-bd);color:var(--inf)}.seat-tile.need{background:var(--amber-bg);border-color:#efd49f;color:var(--amber)}.seat-tile.ro{cursor:default}.seat-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}.seat-legend .lg{font-size:10px;font-weight:750;padding:3px 8px;border-radius:999px;border:1px solid}.paxlist{display:grid;gap:8px;margin:12px 0}.paxrow{display:grid;grid-template-columns:auto 1fr 72px auto;gap:7px;align-items:center}.catchip{border:1.5px solid var(--line);border-radius:9px;min-height:40px;padding:0 9px;font-size:11px;font-weight:850;white-space:nowrap;background:#f7f9fc;color:var(--muted);display:flex;align-items:center}.catchip.need{background:var(--amber-bg);border-color:#efd49f;color:var(--amber)}.paxrow .name{min-width:0}.cell{min-height:40px;padding:7px 8px;font-size:13px;border-radius:9px}.cell.wt{text-align:right}.legend{display:flex;gap:9px;flex-wrap:wrap}
.pax-count-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pax-count-card{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1.5px solid;padding:10px;border-radius:13px}.pax-count-card>div:first-child{display:flex;flex-direction:column}.pax-count-card b{font-size:12px}.pax-count-card span{font-size:9px;opacity:.72}.pax-count-card.need{grid-column:1/-1;background:var(--amber-bg);border-color:#efd49f;color:var(--amber)}.step-control{display:grid;grid-template-columns:31px 38px 31px;align-items:center;border:1px solid rgba(20,55,90,.13);border-radius:10px;overflow:hidden;background:#fff}.step-control button{height:34px;border:0;background:#fff;color:currentColor;font-size:17px;font-weight:850;cursor:pointer}.step-control input{width:38px;min-height:34px;padding:3px 0;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;text-align:center;font-size:15px;font-weight:900;color:currentColor}.balance-badge{padding:5px 8px;border-radius:999px;background:var(--cyan-soft);color:#16718c;font-size:9.5px;font-weight:850;text-transform:uppercase;letter-spacing:.4px}.cabin-shell{position:relative;margin:10px 0 12px;padding:14px 12px 10px;border:1.5px solid #cbd9e7;border-radius:48px 48px 18px 18px;background:linear-gradient(180deg,#eef7ff 0,#fff 22%,#f7f9fc 100%);box-shadow:inset 0 0 0 5px rgba(255,255,255,.8)}.cabin-direction{display:flex;justify-content:space-between;align-items:center;padding:0 12px 4px 29px;color:#4f728e;font-size:8.5px;font-weight:850;text-transform:uppercase;letter-spacing:.8px}.cabin-direction span:last-child:before{content:"\2191";margin-right:4px}.cabin-aft{text-align:center;color:#7b8d9e;font-size:8px;font-weight:850;text-transform:uppercase;letter-spacing:1px}.cabin-shell .seatmap{margin:4px 0 5px}.passenger-details summary{display:flex;justify-content:space-between;gap:10px}.passenger-details summary span{color:var(--blue);font-size:9px;text-transform:uppercase;letter-spacing:.5p
